spring.application.name=SpringCloudApiGateway

# Setting server port number
server.port = 7200

#register with eureka
eureka.client.register-with-eureka= true

#Enable other microservices to interact
eureka.client.fetch-registry= true

# URL for Eureka Server (default is http://localhost:8761/eureka)
eureka.client.service-url.defaultZone = http://localhost:8761/eureka


#Routing info through properties approach
spring.cloud.gateway.routes[0].id=ServiceId
spring.cloud.gateway.routes[0].predicates[0]=Path=/v1/path/**
spring.cloud.gateway.routes[0].filters[0]=AddRequestHeader=key,value
spring.cloud.gateway.routes[0].filters[1]=AddResponseHeader=key,value


